<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AutumnApply · 本地资料库</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <header class="hero">
      <div>
        <p class="eyebrow">AUTUMNAPPLY</p>
        <h1>本地求职资料库</h1>
        <p>这里是所有匹配、简历定制和自动填表的事实来源。资料只保存在当前浏览器。</p>
      </div>
      <div class="privacy-badge">本地存储 · 不自动提交</div>
    </header>

    <main>
      <form id="profile-form">
        <section class="panel">
          <div class="section-heading">
            <div><span>01</span><h2>基本信息</h2></div>
            <p>至少填写姓名，以及邮箱或手机号中的一项。</p>
          </div>
          <div class="grid three">
            <label>姓名<input name="fullName" autocomplete="name" /></label>
            <label>邮箱<input name="email" type="email" autocomplete="email" /></label>
            <label>手机号<input name="phone" autocomplete="tel" /></label>
            <label>所在城市<input name="city" autocomplete="address-level2" /></label>
            <label>GitHub<input name="github" type="url" placeholder="https://github.com/..." /></label>
            <label>个人网站<input name="website" type="url" /></label>
          </div>
        </section>

        <section class="panel">
          <div class="section-heading">
            <div><span>02</span><h2>教育经历</h2></div>
            <button class="secondary" type="button" data-add="education">添加教育经历</button>
          </div>
          <div id="education-list" class="card-list"></div>
        </section>

        <section class="panel">
          <div class="section-heading">
            <div><span>03</span><h2>实习与工作经历</h2></div>
            <button class="secondary" type="button" data-add="experiences">添加经历</button>
          </div>
          <div id="experiences-list" class="card-list"></div>
        </section>

        <section class="panel">
          <div class="section-heading">
            <div><span>04</span><h2>项目经历</h2></div>
            <button class="secondary" type="button" data-add="projects">添加项目</button>
          </div>
          <div id="projects-list" class="card-list"></div>
        </section>

        <section class="panel">
          <div class="section-heading">
            <div><span>05</span><h2>技能与求职偏好</h2></div>
          </div>
          <div class="grid two">
            <label>技能关键词<textarea name="skills" rows="4" placeholder="Python、SQL、数据分析"></textarea></label>
            <label>目标岗位<textarea name="roles" rows="4" placeholder="数据分析师、产品经理"></textarea></label>
            <label>目标城市<input name="locations" placeholder="上海、北京、深圳" /></label>
            <label>毕业年份<input name="graduationYear" inputmode="numeric" placeholder="2027" /></label>
            <label>最低匹配分数<input name="minimumScore" type="number" min="0" max="100" /></label>
          </div>
        </section>

        <section class="panel">
          <div class="section-heading">
            <div><span>06</span><h2>常见开放题</h2></div>
            <button class="secondary" type="button" data-add="commonAnswers">添加问答</button>
          </div>
          <div id="common-answers-list" class="card-list"></div>
        </section>

        <div class="sticky-actions">
          <div id="save-status" role="status"></div>
          <button class="primary" type="submit">保存资料</button>
        </div>
      </form>

      <section class="panel data-tools">
        <div class="section-heading">
          <div><span>07</span><h2>备份与隐私</h2></div>
        </div>
        <p>导出的 JSON 包含你的完整求职资料，请像保护简历和身份证材料一样妥善保存。</p>
        <div class="button-row">
          <button id="export-profile" class="secondary" type="button">导出资料备份</button>
          <label class="secondary file-button">导入资料备份<input id="import-profile" type="file" accept="application/json" /></label>
          <button id="clear-data" class="danger" type="button">清除本机数据</button>
        </div>
      </section>

      <section class="panel">
        <div class="section-heading">
          <div><span>08</span><h2>投递台账</h2></div>
          <p>保存在当前浏览器，不与招聘网站自动同步。</p>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>公司与岗位</th><th>匹配</th><th>状态</th><th>更新时间</th><th>来源</th></tr></thead>
            <tbody id="application-rows"></tbody>
          </table>
          <div id="application-empty" class="empty-state">还没有投递记录。请从扩展弹窗分析岗位并保存。</div>
        </div>
      </section>
    </main>

    <template id="education-template">
      <article class="entry-card" data-entry="education">
        <div class="entry-header"><strong>教育经历</strong><button type="button" class="text-danger" data-remove>删除</button></div>
        <input type="hidden" data-field="id" />
        <div class="grid three">
          <label>学校<input data-field="school" /></label>
          <label>学历<input data-field="degree" placeholder="本科 / 硕士" /></label>
          <label>专业<input data-field="major" /></label>
          <label>GPA<input data-field="gpa" /></label>
          <label>入学时间<input data-field="startDate" type="month" /></label>
          <label>毕业时间<input data-field="graduationDate" type="month" /></label>
        </div>
      </article>
    </template>

    <template id="story-template">
      <article class="entry-card" data-entry="story">
        <div class="entry-header"><strong data-card-title>经历</strong><button type="button" class="text-danger" data-remove>删除</button></div>
        <input type="hidden" data-field="id" />
        <div class="grid two">
          <label>名称 / 职位<input data-field="title" /></label>
          <label>组织 / 公司<input data-field="organization" /></label>
          <label>开始时间<input data-field="startDate" type="month" /></label>
          <label>结束时间<input data-field="endDate" type="month" placeholder="至今" /></label>
          <label class="wide">概述<textarea data-field="summary" rows="3"></textarea></label>
          <label class="wide">成果要点（每行一条）<textarea data-field="highlights" rows="4"></textarea></label>
          <label class="wide">关键词<input data-field="keywords" placeholder="Python、增长、用户研究" /></label>
        </div>
      </article>
    </template>

    <template id="answer-template">
      <article class="entry-card" data-entry="answer">
        <div class="entry-header"><strong>常见问题</strong><button type="button" class="text-danger" data-remove>删除</button></div>
        <input type="hidden" data-field="id" />
        <label>问题<input data-field="question" placeholder="为什么申请这个岗位？" /></label>
        <label>事实答案素材<textarea data-field="answer" rows="4"></textarea></label>
      </article>
    </template>

    <script type="module" src="options.js"></script>
  </body>
</html>
